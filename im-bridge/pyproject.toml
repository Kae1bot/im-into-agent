[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "im-bridge"
version = "0.1.0"
description = "Multi-IM to agent bridge: unified contract + per-IM adapters"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
im-bridge = "im_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
